<!DOCTYPE html>
<html lang="uk">
<head>

    <style>
        body {

            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .even {
            color: green;
            font-weight: bold;
        }
        .odd {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Лабораторна робота №1: Основи JavaScript</h1>

    <section>
        <h2>Завдання 1: Привітання</h2>
        <div id="greeting-output"></div>
    </section>

    <section>
        <h2>Завдання 2: Перевірка confirm</h2>
        <div id="confirm-output"></div>
    </section>

    <section>
        <h2>Завдання 3: Таблиця множення</h2>
        <div id="multiplication-output"></div>
    </section>

    <section>
        <h2>Завдання 4: Перевірка номера журналу</h2>
        <div id="number-check-output"></div>
    </section>

    <script type="module" src="script.js"></script>

</html>
